# Publishes the demo on GitHub Pages. Manual only: merging never publishes anything.
# Needs Pages enabled in the repository settings with "GitHub Actions" as the source.
name: Publicar en GitHub Pages

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Dirección pública (para og:image y canonical), p. ej. https://usuario.github.io/aerovia-inspector-demo/'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
        env:
          BASE_PATH: /aerovia-inspector-demo/
          SITE_URL: ${{ inputs.site_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
