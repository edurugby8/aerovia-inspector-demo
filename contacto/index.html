<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Contacto · AEROVIA INSPECTOR</title>
    <meta name="description" content="Solicite un presupuesto de inspección con drones: qué incluir en su solicitud para planificar la inspección de su activo." />
    <!--site:head-->
  </head>
  <body data-page="contacto">
    <!--site:header-->
    <main id="contenido" tabindex="-1">
      <section class="page-head" aria-labelledby="titulo">
        <div class="wrap">
          <p class="label">Contacto</p>
          <h1 class="h1" id="titulo">Solicitar presupuesto</h1>
          <p class="lead">Cuéntenos qué activo necesita revisar y dónde está. Le responderemos para planificar la inspección.</p>
        </div>
      </section>

      <section class="section" aria-labelledby="t-incluir">
        <div class="wrap contact-layout">
          <div>
            <div class="notice" role="note">
              <p class="label">Datos de contacto</p>
              <p data-contact-line><!--site:contact-line--></p>
            </div>
            <h2 class="h3 include-title" id="t-incluir">Qué incluir en su solicitud</h2>
            <!--site:contact-include-->
          </div>
          <aside class="template" aria-labelledby="t-plantilla">
            <h2 class="h3" id="t-plantilla">Plantilla para su mensaje</h2>
            <p class="muted">Copie estos puntos y complételos al escribirnos.</p>
            <pre data-template><!--site:contact-template--></pre>
            <button class="btn btn-line" type="button" data-copy hidden>Copiar plantilla</button>
            <p data-copy-status aria-live="polite"></p>
          </aside>
        </div>
      </section>
    </main>
    <!--site:footer-->
  </body>
</html>
